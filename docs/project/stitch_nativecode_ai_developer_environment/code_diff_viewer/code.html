<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Code &amp; Git Diff Viewer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdcc6",
                        "outline-variant": "#4a4455",
                        "surface-variant": "#37333e",
                        "on-tertiary-container": "#ffe0cd",
                        "on-primary-container": "#ede0ff",
                        "on-primary-fixed-variant": "#5a00c6",
                        "on-secondary-fixed-variant": "#004e5c",
                        "on-surface-variant": "#ccc3d8",
                        "secondary": "#4cd7f6",
                        "surface-container-highest": "#37333e",
                        "primary-fixed": "#eaddff",
                        "on-primary-fixed": "#25005a",
                        "on-secondary": "#003640",
                        "error": "#ffb4ab",
                        "on-secondary-container": "#00424e",
                        "secondary-fixed-dim": "#4cd7f6",
                        "on-secondary-fixed": "#001f26",
                        "surface-container-low": "#1d1a24",
                        "secondary-fixed": "#acedff",
                        "primary": "#d2bbff",
                        "secondary-container": "#03b5d3",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#301400",
                        "outline": "#958da1",
                        "error-container": "#93000a",
                        "on-tertiary": "#4f2500",
                        "on-background": "#e8dfee",
                        "tertiary-fixed-dim": "#ffb784",
                        "surface-container-lowest": "#100d16",
                        "on-error": "#690005",
                        "primary-container": "#7c3aed",
                        "tertiary-container": "#a15100",
                        "surface-dim": "#15121b",
                        "on-tertiary-fixed-variant": "#713700",
                        "background": "#15121b",
                        "inverse-surface": "#e8dfee",
                        "on-primary": "#3f008e",
                        "primary-fixed-dim": "#d2bbff",
                        "surface-tint": "#d2bbff",
                        "surface-container-high": "#2c2833",
                        "on-surface": "#e8dfee",
                        "inverse-primary": "#732ee4",
                        "tertiary": "#ffb784",
                        "surface-container": "#221e28",
                        "surface": "#15121b",
                        "surface-bright": "#3c3742",
                        "inverse-on-surface": "#332f39"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "base": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "md": "16px",
                        "2xl": "48px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "code-md": ["JetBrains Mono"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-sm": ["Inter"],
                        "code-sm": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "code-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }],
                        "code-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom syntax highlighting colors for JetBrains Mono code block to match Modern Corporate/Glassmorphism theme */
        .token.keyword { color: #d2bbff; } /* primary */
        .token.operator { color: #4cd7f6; } /* secondary */
        .token.string { color: #ffb784; } /* tertiary */
        .token.variable { color: #e8dfee; } /* on-surface */
        .token.diff-remove { background-color: rgba(147, 0, 10, 0.2); } /* error-container */
        .token.diff-add { background-color: rgba(3, 181, 211, 0.2); } /* secondary-container */
        
        /* Subtle grid background for the void effect */
        .bg-void-grid {
            background-image: 
                linear-gradient(to right, rgba(45, 51, 68, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(45, 51, 68, 0.2) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col bg-void-grid selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-md py-sm w-full z-50 bg-surface-dim dark:bg-surface-dim border-b border-outline-variant dark:border-outline-variant flat no shadows h-[56px] fixed top-0 w-full transition-opacity opacity-100 backdrop-blur-md bg-opacity-90">
<div class="flex items-center gap-sm">
<button aria-label="Back" class="p-xs text-on-surface-variant hover:bg-surface-variant rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center gap-xs">
<span class="font-headline-md text-headline-md text-primary dark:text-primary tracking-tight">MainActivity.kt</span>
<span class="font-label-caps text-label-caps bg-surface-variant text-on-surface-variant px-2 py-1 rounded-[4px] ml-sm border border-outline-variant opacity-80">Git Diff</span>
</div>
</div>
<div class="flex items-center gap-sm">
<button aria-label="More options" class="p-sm text-on-surface-variant hover:bg-surface-variant rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-[56px] mb-[80px] p-md md:p-margin-desktop max-w-7xl mx-auto w-full flex flex-col gap-lg">
<!-- Diff Viewer Card -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg overflow-hidden flex flex-col shadow-lg shadow-black/20 relative z-10">
<!-- Card Header -->
<div class="bg-surface-container px-md py-sm border-b border-outline-variant flex justify-between items-center">
<div class="flex items-center gap-sm text-on-surface-variant">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="code">code</span>
<span class="font-code-sm text-code-sm">app/src/main/java/com/nativecode/MainActivity.kt</span>
</div>
<div class="flex gap-xs">
<span class="font-label-caps text-label-caps bg-error-container text-on-error-container px-2 py-0.5 rounded-[4px]">-1</span>
<span class="font-label-caps text-label-caps bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-[4px]">+2</span>
</div>
</div>
<!-- Code Area -->
<div class="p-0 overflow-x-auto bg-[#050505]">
<table class="w-full font-code-md text-code-md border-collapse text-left">
<tbody class="text-on-surface">
<!-- Unchanged context line -->
<tr class="hover:bg-surface-variant/30 group">
<td class="w-12 px-2 py-1 text-right text-outline-variant select-none border-r border-outline-variant/30">11</td>
<td class="w-12 px-2 py-1 text-right text-outline-variant select-none border-r border-outline-variant/30">11</td>
<td class="w-8 px-2 py-1 text-center text-outline-variant select-none"></td>
<td class="px-md py-1 whitespace-pre"><span class="token keyword">class</span> <span class="token variable">MainActivity</span> : <span class="token variable">ComponentActivity</span>() {</td>
</tr>
<!-- Removed Line -->
<tr class="token.diff-remove hover:bg-error-container/30 group">
<td class="w-12 px-2 py-1 text-right text-outline-variant select-none border-r border-outline-variant/30">12</td>
<td class="w-12 px-2 py-1 text-right text-outline-variant select-none border-r border-outline-variant/30"></td>
<td class="w-8 px-2 py-1 text-center text-error select-none font-bold">-</td>
<td class="px-md py-1 whitespace-pre line-through decoration-error/50"><span class="opacity-70"> <span class="token keyword">val</span> <span class="token variable">oldState</span> <span class="token operator">=</span> <span class="token string">"loading"</span></span></td>
</tr>
<!-- Added Line 1 -->
<tr class="token.diff-add hover:bg-secondary-container/30 group">
<td class="w-12 px-2 py-1 text-right text-outline-variant select-none border-r border-outline-variant/30"></td>
<td class="w-12 px-2 py-1 text-right text-secondary select-none border-r border-outline-variant/30">12</td>
<td class="w-8 px-2 py-1 text-center text-secondary select-none font-bold">+</td>
<td class="px-md py-1 whitespace-pre"> <span class="token keyword">val</span> <span class="token variable">newState</span> <span class="token operator">=</span> <span class="token string">"ready"</span></td>
</tr>
<!-- Added Line 2 -->
<tr class="token.diff-add hover:bg-secondary-container/30 group">
<td class="w-12 px-2 py-1 text-right text-outline-variant select-none border-r border-outline-variant/30"></td>
<td class="w-12 px-2 py-1 text-right text-secondary select-none border-r border-outline-variant/30">13</td>
<td class="w-8 px-2 py-1 text-center text-secondary select-none font-bold">+</td>
<td class="px-md py-1 whitespace-pre"> <span class="token keyword">val</span> <span class="token variable">isReady</span> <span class="token operator">=</span> <span class="token keyword">true</span></td>
</tr>
<!-- Unchanged context line -->
<tr class="hover:bg-surface-variant/30 group">
<td class="w-12 px-2 py-1 text-right text-outline-variant select-none border-r border-outline-variant/30">13</td>
<td class="w-12 px-2 py-1 text-right text-outline-variant select-none border-r border-outline-variant/30">14</td>
<td class="w-8 px-2 py-1 text-center text-outline-variant select-none"></td>
<td class="px-md py-1 whitespace-pre"> <span class="token keyword">override</span> <span class="token keyword">fun</span> <span class="token variable">onCreate</span>() {</td>
</tr>
</tbody>
</table>
</div>
<!-- Decorative inner glow for active editing feel -->
<div class="absolute inset-0 pointer-events-none rounded-lg shadow-[inset_0_0_20px_rgba(3,181,211,0.05)]"></div>
</div>
</main>
<!-- Bottom Action Bar (Contextual to this screen, replacing global nav) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container/80 backdrop-blur-xl border-t border-outline-variant/50 p-md z-50 flex justify-end gap-md shadow-[0_-8px_32px_rgba(0,0,0,0.5)]">
<div class="max-w-7xl mx-auto w-full flex justify-end gap-md">
<button class="px-lg py-sm rounded-full font-label-caps text-label-caps border border-outline-variant text-on-surface hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary">
                Discard
            </button>
<button class="px-lg py-sm rounded-full font-label-caps text-label-caps bg-primary-container text-white hover:brightness-110 transition-all shadow-[0_0_15px_rgba(124,58,237,0.3)] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
                Commit Changes
            </button>
</div>
</div>
</body></html>
